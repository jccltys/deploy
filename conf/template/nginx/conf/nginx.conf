user  ${nginx_user};
worker_processes  2;

error_log  ${component_dir}/logs/error.log warn;
pid        ${component_dir}/logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    log_format    main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  ${component_dir}/logs/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # 开启静态资源压缩
    gzip  on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types application/json application/wasm text/plain application/javascript application/glb application/gltf application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    # WebSocket 升级连接映射（/chatV2/ 等 location 使用）
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include ${component_dir}/conf.d/*.conf;

    server {
        listen       ${nginx_listen_port};
        server_name  odc-fe;

        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host:$server_port;
        client_body_buffer_size 1024k;
        proxy_buffer_size  256k;
        proxy_buffering  on;
        proxy_buffers 64 128k;
        proxy_busy_buffers_size 512k;

        location / {
            add_header Access-Control-Allow-Origin *;
            root   ${frontend_dir};
            index  index.html index.htm;
            client_max_body_size 100M;
            try_files $uri $uri/ /index.html /npm/index.html @static;
        }

        location /anyv/ {
            add_header Access-Control-Allow-Origin *;
            root   ${frontend_dir};
            index  index.html index.htm;
            client_max_body_size 100M;
            try_files $uri $uri/ /anyv/index.html;
        }

        location /lowcode/ {
            add_header Access-Control-Allow-Origin *;
            root   ${frontend_dir};
            index  index.html index.htm;
            client_max_body_size 100M;
            try_files $uri $uri/ /lowcode/index.html;
        }

        location /workflow/ {
            add_header Access-Control-Allow-Origin *;
            root   ${frontend_dir};
            index  index.html index.htm;
            client_max_body_size 100M;
            try_files $uri $uri/ /workflow/index.html;
        }

        location /report/ {
            add_header Access-Control-Allow-Origin *;
            root   ${frontend_dir};
            index  index.html index.htm;
            client_max_body_size 500M;
            try_files $uri $uri/ /report/index.html;
        }

        location /report/shareChart/ {
            add_header Access-Control-Allow-Origin *;
            root   ${frontend_dir};
            index  index.html index.htm;
            client_max_body_size 500M;
            try_files $uri $uri/ /report/shareChart.html;
        }

        location /report/shareDashboard/ {
            add_header Access-Control-Allow-Origin *;
            root   ${frontend_dir};
            index  index.html index.htm;
            client_max_body_size 500M;
            try_files $uri $uri/ /report/shareDashboard.html;
        }

        location /report/shareStoryPlayer/ {
            add_header Access-Control-Allow-Origin *;
            root   ${frontend_dir};
            index  index.html index.htm;
            client_max_body_size 500M;
            try_files $uri $uri/ /report/shareStoryPlayer.html;
        }

        location @static {
            root ${frontend_dir};
        }

        # ODC 服务接口
        location /api/report/ {
            proxy_pass  http://${odc_ip}:8202/report/;
            client_max_body_size 500M;
        }

        location /api/pbsr/ {
            proxy_pass  http://${odc_ip}:8202/pbsr/;
            client_max_body_size 100M;
        }

        location /api/eoi-pbsr/ {
            proxy_pass  http://${odc_ip}:8202/pbsr/;
            client_max_body_size 100M;
        }

        location /api/eoi-auth/ {
            proxy_pass  http://${odc_ip}:8202/pbsr/;
            client_max_body_size 100M;
        }

        location /api/odc/ {
            proxy_pass http://${odc_ip}:8202/;
            client_max_body_size 100M;
        }

        location /api/eoi-odc/ {
            proxy_pass http://${odc_ip}:8202/;
            client_max_body_size 100M;
        }

        location /api/anyv/ {
            proxy_pass http://${odc_ip}:8202/anyv/;
            client_max_body_size 100M;
        }

        location /api/eoi-anyv/ {
            proxy_pass http://${odc_ip}:8202/anyv/;
            client_max_body_size 100M;
        }

        location /api/eoi-screenshot/ {
            proxy_pass  http://${odc_ip}:8202/screenshot/;
            client_max_body_size 100M;
        }

        # 文件服务器
        location /api/list_dir {
            proxy_pass  http://${odc_ip}:9876/list_dir;
            client_max_body_size 100M;
        }

        location /api/get_file_info {
            proxy_pass  http://${odc_ip}:9876/get_file_info;
            client_max_body_size 100M;
        }

        location /api/upload {
            proxy_pass  http://${odc_ip}:9876/upload;
            client_max_body_size 100M;
        }

        location /api/delete {
            proxy_pass  http://${odc_ip}:9876/delete;
            client_max_body_size 100M;
        }

        location /api/remove_empty_dir {
            proxy_pass  http://${odc_ip}:9876/remove_empty_dir;
            client_max_body_size 100M;
        }

        location /api/ {
            proxy_pass http://${odc_ip}:8202/;
            client_max_body_size 100M;
        }

        location /origin/ {
            proxy_pass http://${odc_ip}:9876/origin/;
        }

        # nexus
        location /nexus/ {
            proxy_pass http://${odc_ip}:8081/repository/npm-group/;
            proxy_buffer_size 12800k;
            proxy_buffers 4 25600k;
            proxy_busy_buffers_size 25600k;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
        }

        # node 服务
        location /nodeApi/public/ {
            proxy_pass http://${odc_ip}:8899/;
            proxy_connect_timeout 180s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
            client_max_body_size 100M;
        }

        location /nodeApi/ {
            proxy_pass http://${odc_ip}:8899/node-service/;
            proxy_connect_timeout 180s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
            client_max_body_size 100M;
        }

        location /node-service/ {
            proxy_set_header Access-Control-Allow-Origin *;
            proxy_pass http://${odc_ip}:8899/node-service/;
        }

        # 在线编辑器
        location /ide/ {
            proxy_pass http://${odc_ip}:4000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 180s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
            proxy_buffering off;
        }

        # 作战室根因算法
        location /api/huishang/assistant/analysis/retry/status {
            proxy_pass http://${odc_ip}:8100/assistant/analysis/retry/status;
            client_max_body_size 100M;
            proxy_connect_timeout 180s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        # 应急助手-结果详情
        location /api/huishang/aiops/assistant/result/detail {
            proxy_pass http://${odc_ip}:8100/assistant/result/detail;
            client_max_body_size 100M;
            proxy_connect_timeout 180s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        # 交易链路 (aimeter)
        location /api/v1/ {
            proxy_pass http://${aimeter_ip}:36888/aimeter/api/v1/;
            proxy_set_header userToken $http_usertoken;
            proxy_connect_timeout 180s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        location /api/huishang/api/v1/ {
            proxy_pass http://${aimeter_ip}:36888/aimeter/api/v1/;
            proxy_set_header userToken $http_usertoken;
            proxy_connect_timeout 180s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        # ============ 智能体平台（agent-base / chatRag / chatV / runtime）============

        # ---------- 旧版配置（保留参考，勿删）----------
        # 知识库（旧：反代 30188，保留 /chatRag 前缀）
        #location /chatRag/ {
        #    proxy_pass http://${odc_ip}:30188/chatRag/;
        #    proxy_connect_timeout 180s;
        #    proxy_send_timeout 180s;
        #    proxy_read_timeout 180s;
        #    client_max_body_size 200M;
        #}

        # 消息体（旧：简洁版，无 SSE 关缓冲与长超时）
        #location /chatV/ {
        #    proxy_pass http://${odc_ip}:30189/chatV/;
        #    proxy_connect_timeout 180s;
        #    proxy_send_timeout 180s;
        #    proxy_read_timeout 180s;
        #    client_max_body_size 200M;
        #}
        # ---------- 旧版配置结束 ----------

        # agent-base 的 mcp
        location /mcp {
            proxy_pass  http://${odc_ip}:9999/mcp;
            client_max_body_size  100M;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # agent-base
        location /agent/base/ {
            proxy_pass http://${odc_ip}:9999/agent/base/;
            proxy_http_version 1.1;
            client_max_body_size 500M;
            proxy_connect_timeout 3m;
            proxy_send_timeout 3m;
            proxy_read_timeout 3m;
        }

        location /chatTask/ {
            proxy_pass http://${odc_ip}:30187/chatTask/;
            proxy_connect_timeout 3m;
            proxy_send_timeout 3m;
            proxy_read_timeout 3m;
        }

        # 知识库平台（与 ODC 同域，反代到知识库前端容器，末尾 "/" 剥掉 /chatRag 前缀）
        location /chatRag/ {
            proxy_pass http://${odc_ip}:30200/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # SSE 流式问答：关缓冲 + 长超时 + http1.1
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            client_max_body_size 200M;
        }

        # 消息体
        location /chatV/ {
            proxy_pass http://${odc_ip}:30189/chatV/;
            proxy_http_version 1.1;
            client_max_body_size 500M;
            proxy_buffering off;
            proxy_connect_timeout 3m;
            proxy_send_timeout 10m;
            proxy_read_timeout 10m;
        }

        location /chatV2/ {
            proxy_pass http://${odc_ip}:30191/chatV2/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 500M;
            proxy_buffering off;
            proxy_socket_keepalive on;
            proxy_connect_timeout 3m;
            proxy_send_timeout 10m;
            proxy_read_timeout 10m;
        }

        # agent-base 子应用配置：反代到 chatV server，由 chatV 服务静态资源
        location /agent/ {
            proxy_pass http://${odc_ip}:30191/agent/;
            proxy_http_version 1.1;
            client_max_body_size 500M;
            proxy_connect_timeout 3m;
            proxy_send_timeout 3m;
            proxy_read_timeout 3m;
        }

        # 【已废弃】app-control-mcp 独立服务（13001）已并入 chatV server
        location /mcp/control {
            proxy_pass http://${odc_ip}:13001/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 3m;
            proxy_send_timeout 3m;
            proxy_read_timeout 3m;
        }

        location /acp-ui/{
            proxy_pass http://${odc_ip}:30003/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 3m;
            proxy_send_timeout 3m;
            proxy_read_timeout 3m;
        }
        location = /acp-ui { return 301 /acp-ui/; }

        location /runtime/mcp {
            proxy_pass http://${odc_ip}:8001/mcp;
            proxy_http_version 1.1;
            # $http_host 保留浏览器原始 Host:port，MCP transport security 需要
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Sandbox-lifecycle 反代：HTTP + WebSocket（noVNC /websockify）
        location /runtime/sandboxes/ {
            proxy_pass http://${odc_ip}:8080/sandboxes/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            client_max_body_size 100m;
        }

        # Lifecycle-server 运维端点（health check / OpenAPI docs）
        location ~ ^/runtime/(health|docs|openapi\.json|redoc)$ {
            proxy_pass http://${odc_ip}:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Runtime 后端 + 前端 SPA（/runtime/ 下其余路径）
        location /runtime/ {
            proxy_pass http://${odc_ip}:8000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            client_max_body_size 100m;
        }

        # 告警 (refiner)
        location /refinerTwo/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS" always;
                add_header Access-Control-Allow-Headers "apikey,Content-Type,Authorization,origin-auth" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
            proxy_pass http://${refiner_ip}:9091/;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;

            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS" always;
            add_header Access-Control-Allow-Headers "apikey,Content-Type,Authorization,origin-auth" always;
        }

        # 认证 (sso)
        location /authentication/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS" always;
                add_header Access-Control-Allow-Headers "apikey,Content-Type,Authorization,origin-auth" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
            proxy_pass http://${sso_ip}:8080/authentication/;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;

            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS" always;
            add_header Access-Control-Allow-Headers "apikey,Content-Type,Authorization,origin-auth" always;
        }

        location /refiner/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS" always;
                add_header Access-Control-Allow-Headers "apikey,Content-Type,Authorization,origin-auth" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            proxy_pass http://${refiner_ip}:8080/refiner/;
            proxy_set_header Cookie "UA=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzUxMiJ9..HlZ9Urb9sUPRrhTzMQqZgTu9oFXED_R-A2dm_pEaeq6jbp4VBGhFjs9pSI8W9LVyTKe8c2kx2fjKSFNotagssg";
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;

            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS" always;
            add_header Access-Control-Allow-Headers "apikey,Content-Type,Authorization,origin-auth" always;
        }
    }
}