bind 0.0.0.0
port ${sentinel_port}
daemonize yes
dir ${data_dir}
logfile ${log_dir}/sentinel.log
sentinel monitor ${sentinel_name} ${master_host} ${redis_port} 2
sentinel auth-pass ${sentinel_name} ${redis_password}
sentinel down-after-milliseconds ${sentinel_name} 30000
sentinel failover-timeout ${sentinel_name} 180000
sentinel parallel-syncs ${sentinel_name} 2
sentinel deny-scripts-reconfig yes
sentinel resolve-hostnames no
sentinel announce-hostnames no