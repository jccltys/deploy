## 需要变动的配置放在上面
metric.scan.cluster.service.name=cell,uqplus,odmp,ckman,aimeter-scheduler
service.name.planAlert=aimeter-scheduler
#################################### 服务配置(必选) ####################################
# 应用服务WEB访问端口[选填]
server.port=${SERVER_PORT:36889}

############################# nacos 注册中心配置（可选） #############################
# k8s 部署需要指定
#spring.cloud.nacos.discovery.ip=${HOST_IP:}
#spring.cloud.nacos.discovery.port=${SERVER_PORT:36889}

#################################### xxl-job配置(必选) ####################################
# 执行器ip[选填]，为空会自动获取ip
xxl.job.executor.ip=${HOST_IP:}
# 执行器端口号[选填]，小于等于0则自动获取；单机部署多个执行器时，注意要配置不同执行器端口；
xxl.job.executor.port=36890
# 用于访问认证[选填]，accessToken要和中台保持一致，不一致需要修改
xxl.job.accessToken=${XXL_TOKEN:qwer!}

############################# zabbix 配置【gauge】(如使用zabbix功能必选，需要修改) #############################
#zabbix.redis.prefix=zabbix:
# zabbix.redis.timeout 单位是s
#zabbix.redis.timeout=604800
# 一次req请求传入hostId的数量
#zabbix.req.size=50

flyway.dynamic.datasource.ck.placeholders.DATABASE=${CLICKHOUSE_DB:aimeter}

############################# kafka 服务配置(必选)#############################
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:aimeter}