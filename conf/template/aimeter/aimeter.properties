## 需要变动的配置放在上面

############################# spring 配置 (必选,默认可不修改)#############################
# 应用服务 WEB 访问端口
server.port=${SERVER_PORT:36888}

############################# nacos 注册中心配置（可选） #############################
# k8s 部署需要指定
#spring.cloud.nacos.discovery.ip=${HOST_IP:}
#spring.cloud.nacos.discovery.port=${SERVER_PORT:}

############################# flyway多数据源配置（可选） #############################
####### sql #######
flyway.dynamic.datasource.sql.enabled=${FLYWAY_SQL_ENABLED:true}
flyway.dynamic.datasource.sql.locations=classpath:/db/mysql

####### clickhouse #######
flyway.dynamic.datasource.ck.enabled=${FLYWAY_CK_ENABLED:true}
flyway.dynamic.datasource.ck.cluster-name=${CLICKHOUSE_CLUSTER:hsbk}
flyway.dynamic.datasource.ck.table-replicated-enable=true
flyway.dynamic.datasource.ck.locations=classpath:/db/clickhouse
flyway.dynamic.datasource.ck.placeholders.CLUSTER_NAME=${CLICKHOUSE_CLUSTER:hsbk}
flyway.dynamic.datasource.ck.placeholders.LOGIC_NAME=${CLICKHOUSE_LOGIC:hsck}
flyway.dynamic.datasource.ck.placeholders.DATABASE=${CLICKHOUSE_DB:aimeter}
# 有副本的引擎
flyway.dynamic.datasource.ck.placeholders.ENGINE=${CLICKHOUSE_ENGINE:ReplicatedReplacingMergeTree}
# 没有副本的引擎
#flyway.dynamic.datasource.ck.placeholders.ENGINE=${CLICKHOUSE_ENGINE:ReplacingMergeTree}


############################# kafka 服务配置(必选)#############################
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:aimeter}

############################# 文件服务 配置【gauge】(必选，需要修改) #############################
# 上传文件的文件路径（父级）
upload.path=${user.dir}/upload
# 采集插件-脚本，上传文件的文件路径（子级）
upload.shell.path=${upload.path}/shell
# 文件下载uri（需要修改）
download.uri=http://192.168.31.170:8008


############################# kafka topic配置（必选, 默认可不改） #########################
# 是否开启topic创建，默认不开启
aimeter.kafka.auto-create-topic-enable=${KAFKA_TOPIC_CREATE_ENABLE:true}
# 日历变更通知消息
kafka.topic.input.calendar.event=${KAFKA_GROUP_ID:aimeter_calendar_event_change}

##kafka topic配置【gauge】(必选,默认可不改)
kafka.topic.input.discover=aimeter_discovery
kafka.topic.input.host=aimeter_host
## 宕机告警输入topic
kafka.topic.input.alert=aimeter_cell_alert
## 宕机告警输出topic
kafka.topic.output.event=aimeter_alert_out

##kafka topic配置【algorithm】(必选,默认可不改)
# 趋势预测结果输出的topic
kafka.topic.output.trend-predict=aimeter_alg_prediction_offline
# 算法模型变化时，消息需要通知告的topic
kafka.topic.input.alg.lab-model=aimeter_alg_lab_model
# 模型推荐结果输出的topic
kafka.topic.output.alg.model-recommendation=aimeter_alg_model_recommendation
# 离线异常分析结果输出的topic
kafka.topic.output.alg.detection-offline=aimeter_alg_detection_offline

############################# 弹性作业 配置【gauge】(必选) #############################
# 启动命令
app.command=cd app/aimeter-processor/rowcolumn && ./start.sh -f
# 物料路径
app.artifact=file:///home/app/jax/jax/plugin/aimeter-processor-2.1.0-20240731-69ed5855.tar.gz#app

############################# grafana 配置【gauge】(必选，需要修改) #############################
#granfana服务地址(必填，需要修改)
spring.requestUrl.grafana=http://192.168.31.170:3000
spring.restTemplate.maxTotal=800
spring.restTemplate.maxRoute=200

############################# apm 数据接入配置（必配） #############################
#
#  kafka 数据源配置，我们会从 kafka 数据源接入 apm 链路原始数据
#  经过清洗、标准化、聚合，在次把标注化的链路数据存入 kafka
#
apm.kafka.name=${KAFKA_NAME:apm_kafka}
apm.kafka.urls=${KAFKA_URL:192.168.31.172:9092,192.168.31.173:9092,192.168.31.174:9092}
apm.kafka.auth.securityProtocol=PLAINTEXT
#apm.kafka.auth.saslMechanism=
#apm.kafka.auth.saslJaasConfig=
#apm.kafka.auth.saslKerberosServiceName=
#apm.kafka.auth.sslEnabledProtocols=
#apm.kafka.auth.sslEndpointIdentificationAlgorithm=
#apm.kafka.auth.sslKeyPassword=
#apm.kafka.auth.sslKeystoreLocation=
#apm.kafka.auth.sslKeystorePassword=
#apm.kafka.auth.sslKeystoreType=
#apm.kafka.auth.sslTruststoreLocation=
#apm.kafka.auth.sslTruststorePassword=
#apm.kafka.auth.sslTruststoreType=

# kafka 自动创建 topic
# apm 会把处理之后的链路数据、指标等写回 kafka，你可以通过下面的配置自动创建这些数据的 topic
# kafka partition 数推荐为 kafka 节点数量 - 1（同 skywalking segments partitions）
# 自动创建topic统一使用aimeter.kafka.auto-create-topic-enable配置
#apm.kafka.auto-create-topic.enable=${KAFKA_TOPIC_AUTO_CREATE:true}
apm.kafka.auto-create-topic.replication-factor=${KAFKA_TOPIC_REPLIC:2}
apm.kafka.auto-create-topic.partitions=${KAFKA_TOPIC_PARTITIONS:3}

# cksinker 配置
# cksinker 中的 clickhouse 节点与 port，按照 cksinker 的配置约定，
# 每个 hosts 是一个 sharding，hosts 可通过 , 分割配置多个 host，每个 host 是一个副本
#      nodes:
#        - hosts: 192.168.31.172,192.168.31.173
#        - hosts: 192.168.31.174,192.168.31.175
apm.ck.sinker.auto-create-enable=${CKSINKER_AUTO_CREATE_ENABLE:true}
apm.ck.sinker.nodes-str=${CKSINKER_CLICKHOUSE_NODES:192.168.31.170,192.168.31.171}
apm.ck.sinker.port=${CKSINKER_CLICKHOUSE_NODES_PORT:9000}
apm.ck.sinker.consumer-group-prefix=aimeter_apm
apm.ck.sinker.cpu=${CKSINKER_CPU_CORE:1}
apm.ck.sinker.instance-count=${CKSINKER_INSTANCE:1}
apm.ck.sinker.memory=${CKSINKER_MEMORY:1024}

# 原始链路明细（Segment-Span） topic 配置
apm.trace.segment.topic=skywalking-segments
apm.trace.segment.offset=latest

# skywalking jvm 指标接入配置
apm.trace.jvm-metric.access=true
apm.trace.jvm-metric.source-topic=skywalking-metrics
apm.trace.jvm-metric.sink-topic=apm_jvm_metric

# apm 会通过中台 flink 流任务清洗、聚合链路数据，需要配置中台 hadoop 集群，flink 框架名称
apm.trace.jax.cluster=${JAX_CLUSTER_NAME:pson}
apm.trace.jax.flink-framework=${JAX_FLINK_FRAMEWORK:Flink_1_12_Yarn}

# flink 并行度、slot 等相关参数
# flink 并行度推荐为 n * kafka partition（skywalking segments 链路 topic）
# kafka partition 数推荐为 kafka 节点数量 - 1
apm.trace.jax.parallelism=${JAX_FLINK_PARALLELISM:1}
apm.trace.jax.yarn-slot=${JAX_FLINK_YARN_SLOT:1}

# task-manager 数量 = parallelism / yarn-slot 向上取整
apm.trace.jax.job-manager-memory=${JAX_FLINK_JOB_MANAGER_MEMORY:1024}
apm.trace.jax.task-manager-memory=${JAX_FLINK_TASK_MANAGER_MEMORY:1024}

# 是否对外输出 apm 链路指标
apm.trace.aimeter.sink=true
apm.trace.aimeter.topic=aimeter_join_metric

# kafka 命名空间，配置不同的 namespace 可以实现同一套 kafka 环境下不同 apm 环境的数据隔离
apm.trace.topic.namespace=${KAFKA_NAMESPACE:}

apm.trace.topic.span=${apm.trace.topic.namespace}apm_span

apm.trace.topic.service=${apm.trace.topic.namespace}apm_service
apm.trace.topic.service-server-metric=${apm.trace.topic.namespace}apm_service_server_metric
apm.trace.topic.service-client-metric=${apm.trace.topic.namespace}apm_service_client_metric

apm.trace.topic.service-instance=${apm.trace.topic.namespace}apm_service_instance
apm.trace.topic.service-instance-metric=${apm.trace.topic.namespace}apm_service_instance_metric

apm.trace.topic.service-span=${apm.trace.topic.namespace}apm_service_span
apm.trace.topic.service-span-metric=${apm.trace.topic.namespace}apm_service_span_metric

apm.trace.topic.service-accept-client=${apm.trace.topic.namespace}apm_service_accept_client
apm.trace.topic.service-accept-client-metric=${apm.trace.topic.namespace}apm_service_accept_client_metric

apm.trace.topic.client-to-peer=${apm.trace.topic.namespace}apm_client_to_peer
apm.trace.topic.client-to-peer-metric=${apm.trace.topic.namespace}apm_client_to_peer_metric

apm.trace.topic.client-to-peer-span=${apm.trace.topic.namespace}apm_client_to_peer_span
apm.trace.topic.client-to-peer-span-metric=${apm.trace.topic.namespace}apm_client_to_peer_span_metric

apm.trace.topic.topology=${apm.trace.topic.namespace}apm_topology
apm.trace.topic.topology-metric=${apm.trace.topic.namespace}apm_topology_metric

apm.trace.topic.peer=${apm.trace.topic.namespace}apm_peer
apm.trace.topic.peer-metric=${apm.trace.topic.namespace}apm_peer_metric

apm.trace.topic.peer-statement=${apm.trace.topic.namespace}apm_peer_statement
apm.trace.topic.peer-statement-metric=${apm.trace.topic.namespace}apm_peer_statement_metric

apm.trace.topic.path-with-trace=${apm.trace.topic.namespace}apm_path_with_trace

apm.trace.topic.span-error=${apm.trace.topic.namespace}apm_span_error
apm.trace.topic.log-template=${apm.trace.topic.namespace}apm_log_template

apm.trace.topic.scene=${apm.trace.topic.namespace}apm_scene
apm.trace.topic.scene-metric=${apm.trace.topic.namespace}apm_scene_metric
apm.trace.topic.scene-path=${apm.trace.topic.namespace}apm_scene_path
apm.trace.topic.scene-path-metric=${apm.trace.topic.namespace}apm_scene_path_metric

apm.trace.topic.server-path=${apm.trace.topic.namespace}apm_server_path
apm.trace.topic.server-path-metric=${apm.trace.topic.namespace}apm_server_path_metric
apm.trace.topic.server-trace-path=${apm.trace.topic.namespace}apm_server_trace_path
apm.trace.topic.server-trace-path-metric=${apm.trace.topic.namespace}apm_server_trace_path_metric

apm.trace.topic.scene-server-path=${apm.trace.topic.namespace}apm_scene_server_path
apm.trace.topic.scene-server-path-metric=${apm.trace.topic.namespace}apm_scene_server_path_metric
apm.trace.topic.scene-server-trace-path=${apm.trace.topic.namespace}apm_scene_server_trace_path
apm.trace.topic.scene-server-trace-path-metric=${apm.trace.topic.namespace}apm_scene_server_trace_path_metric

apm.trace.topic.scene-trans-path=${apm.trace.topic.namespace}apm_scene_trans_path
apm.trace.topic.scene-trans-path-metric=${apm.trace.topic.namespace}apm_scene_trans_path_metric

# 支持 span 和 span_with_index
apm.dynamic.trace.query-type=span_with_index
apm.dynamic.topology.cache-size=100000
apm.dynamic.topology.max-query-size=2000
apm.dynamic.topology.matrix-step=5
apm.dynamic.topology.include-binary-data=true

