## 各产线放置公共配置的地方

############################# nacos 注册中心配置（必选，需要修改） #############################
spring.cloud.nacos.discovery.server-addr=${NACOS_HOST:192.168.31.170:8848}
spring.cloud.nacos.discovery.username=${NACOS_USER:nacos}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:nacos}
# 注册到 nacos 的指定 namespace，默认为 public
spring.cloud.nacos.discovery.namespace=
spring.cloud.nacos.discovery.group=${NACOS_GROUP:DEFAULT_GROUP}

############################# 默认sql 配置（必选，需要修改） #############################
## mysql
spring.datasource.sql.jdbc-url=jdbc:mysql://${MYSQL_HOST:192.168.31.171:3306}/${MYSQL_DB:aimeter}?characterEncoding=utf8&useSSL=false&rewriteBatchedStatements=true&allowMultiQueries=true
spring.datasource.sql.username=${MYSQL_USER:root}
spring.datasource.sql.password=${MYSQL_PASSWORD:MySQL@123}
spring.datasource.sql.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.sql.hikari.maximum-pool-size=25
spring.datasource.sql.hikari.minimum-idle=10

############################# ck 配置（必选，需要修改） #############################
spring.datasource.ck.jdbc-url=jdbc:clickhouse://${CLICKHOUSE_HOST:192.168.31.170:8123,192.168.31.171:8123}/${CLICKHOUSE_DB:aimeter}
spring.datasource.ck.username=${CLICKHOUSE_USER:default}
spring.datasource.ck.password=${CLICKHOUSE_PASSWORD:Hsbk@123}
# ck集群名称
spring.datasource.ck.cluster-name=${CLICKHOUSE_CLUSTER:hsbk}
spring.datasource.ck.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver

############################# redis 配置（必选，需要修改） #############################
# redis模式类型 single, sentinel, cluster
spring.redis.mode=${REDIS_MODE:single}
# Redis数据库索引（默认为0）
spring.redis.database=${REDIS_DB:0}
# Redis服务器地址
spring.redis.host=${REDIS_HOST:192.168.31.170}
# Redis服务器连接端口
spring.redis.port=${REDIS_PORT:6379}
# Redis服务器连接密码（默认为空）
spring.redis.password=${REDIS_PASSWORD:Reids@123}
# 使用哨兵模式时放开，默认都注释掉
#spring.redis.sentinel.master=${REDIS_SENTINEL_MASTER:mymaster}
#spring.redis.sentinel.nodes=${REDIS_SENTINEL_NODES:192.168.31.173:26379,192.168.31.170:26379,192.168.31.171:26379}
# 使用集群模式时放开，默认都注释掉
#spring.redis.cluster.nodes=${REDIS_CLUSTER_NODES:}

############################# kafka 服务配置（必选，需要修改）#############################
spring.kafka.bootstrap-servers=${KAFKA_HOST:192.168.31.172:9092,192.168.31.173:9092,192.168.31.174:9092}

############################# kafka topic配置（必选, 默认可不改） #########################
# 日历变更通知消息
kafka.topic.input.calendar.event=${KAFKA_GROUP_ID:aimeter_calendar_event_change}

##kafka topic配置【gauge】(必选,默认可不改)
kafka.topic.input.discover=aimeter_discovery
kafka.topic.input.host=aimeter_host
## 宕机告警输入topic
kafka.topic.input.alert=aimeter_cell_alert
## 宕机告警输出topic
kafka.topic.output.event=aimeter_alert_out

##kafka topic配置【algorithm】(必选,默认可不改)
# 趋势预测结果输出的topic
kafka.topic.output.trend-predict=aimeter_alg_prediction_offline
# 算法模型变化时，消息需要通知告的topic
kafka.topic.input.alg.lab-model=aimeter_alg_lab_model
# 模型推荐结果输出的topic
kafka.topic.output.alg.model-recommendation=aimeter_alg_model_recommendation
# 离线异常分析结果输出的topic
kafka.topic.output.alg.detection-offline=aimeter_alg_detection_offline

#########################跨域 配置(可选)############################
## Access-Control-Allow-Origin 报头中仅允许指定的受信任域，多个用,分隔
cors.allowed-origins=*
cors.allowed-headers=*
cors.allowed-methods=*
