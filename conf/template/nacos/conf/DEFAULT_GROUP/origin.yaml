        license: Powered By Origin
        license-url: https://Origin.com
    #自定义路由开启
    ribbon:
        rule:
            ennabled: true
            priorIpPattern: 192.168.31.170
    # 当前产品实施客户
    customer: 
        id: origin
        name: 擎创科技
    log:
        request:
            enabled: false
        api:
            enabled: false
        operate:
            enabled: true
    # 应急场景调用cmdb的接口配置
    em:
        cmdb:
            baseUrl: http://192.168.31.170:30116/api
    #执行sql打印
    mybatis-plus:
        sql-log: false
    #token配置
    token:
        #是否有状态
        state: true
        expire: 7200
    http:
        level: NONE
    #接口配置
    api:
        #报文加密配置
        crypto:
            #启用报文加密配置
            enabled: false
            #使用AesUtil.genAesKey()生成
            aes-key: O2BEeIv399qHQNhD6aGW8R8DEj4bqHXm
            #使用DesUtil.genDesKey()生成
            des-key: jMVCBsFGDQr1USHo
    #jackson配置
    jackson:
        #null自动转空值
        null-to-empty: true
        #大数字自动转字符串
        big-num-to-string: true
        #支持text文本请求,与报文加密同时开启
