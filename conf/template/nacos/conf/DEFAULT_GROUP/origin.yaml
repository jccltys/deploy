#服务器配置
server:
    undertow:
        # 设置IO线程数, 它主要执行非阻塞的任务,它们会负责多个连接, 默认设置每个CPU核心一个线程
        io-threads: 16
        # 阻塞任务线程池, 当执行类似servlet请求阻塞操作, undertow会从这个线程池中取得线程,它的值设置取决于系统的负载
        worker-threads: 400
        # 以下的配置会影响buffer,这些buffer会用于服务器连接的IO操作,有点类似netty的池化内存管理
        buffer-size: 1024
        # 是否分配的直接内存
        direct-buffers: true
        max-http-post-size: 100MB
    netty:
        max-initial-line-length: 1000000

#spring配置
spring:
    http: 
        multipart: 
            enabled: true
            max-file-size: 512MB
            max-request-size: 512MB
    servlet:
        multipart:
            max-file-size: 512MB
            max-request-size: 512MB
    cloud:
        sentinel:
            eager: true
        gateway:
            httpclient:
                max-initial-line-length: 100000
    devtools:
        restart:
            log-condition-evaluation-delta: false
        livereload:
            port: 23333
    flyway:
        enabled: false
    #不存在flyway_schema_history表时自动创建
        baseline-on-migrate: true
        validate-on-migrate: false
    #禁止清理
        cleanDisabled: true
        out-of-order: true        
#mybatis-plus配置
mybatis-plus:
    mapper-locations: classpath:org/origin/**/**/mapper/*Mapper.xml, classpath:/com/eoi/dragon/**/mapper/*.xml
    #实体扫描，多个package用逗号或者分号分隔
    typeAliasesPackage: org.origin.**.**.entity
    configuration:
        map-underscore-to-camel-case: true
        call-setters-on-nulls: true
        # log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
        log-impl: org.apache.ibatis.logging.stdout.StdOutImpl 
        #开启sql日志
    type-handlers-package: org.origin.goblin.common.globaltypeahandler
#feign配置
feign:
    sentinel:
        enabled: true
    okhttp:
        enabled: true
    httpclient:
        enabled: false

