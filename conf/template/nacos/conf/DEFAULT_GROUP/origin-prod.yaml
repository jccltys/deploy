spring:
  data: 
    redis:
      # redis 单机环境配置，以下根据情况配置，（需要修改）
      host: 192.168.31.170
      port: 6379
      password: Reids@123
      database: 9
      ssl: 
        enabled: false
    # redis 集群环境配置
    #cluster:
    #  nodes: 192.168.31.170:6379,192.168.31.171:6379,192.168.31.172:6379,192.168.31.170:6389,192.168.31.171:6389,192.168.31.172:6389
    #  commandTimeout: 5000

    # redis 哨兵环境配置
    # sentinel:
    #   master: mymaster
    #   nodes: redis-host1:26379,redis-host2:26379,redis-host3:26379

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # driver-class-name: dm.jdbc.driver.DmDriver
    type: com.zaxxer.hikari.HikariDataSource
    #driver-class-name: org.postgresql.Driver
    #driver-class-name: oracle.jdbc.OracleDriver
    #driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    # 在使用Spring默认数据源Hikari的情况下配置以下配置项
    druid:
      # 初始化时建立物理连接的个数
      initial-size: 0
      # 最小连接数
      min-idle: 10
      #最大连接数
      max-active: 60
      # 获取连接时最大等待时间，单位毫秒。配置了maxWait之后，
      # 缺省启用公平锁，并发效率会有所下降，
      # 如果需要可以通过配置useUnfairLock属性为true使用非公平锁。
      max-wait: 6000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      time-between-eviction-runs-millis: 2000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      min-evictable-idle-time-millis: 600000
      max-evictable-idle-time-millis: 900000
      # 验证语句
      validation-query: select 1
    hikari:
      # 自动提交从池中返回的连接
      auto-commit: true
      # 连接池中维护的最小空闲连接数
      minimum-idle: 10
      # 连接池中允许的最大连接数。缺省值：10；推荐的公式：((core_count * 2) + effective_spindle_count)
      maximum-pool-size: 60
      # 空闲连接超时时间，默认值600000（10分钟）大于等于max-lifetime且max-lifetime>0，会被重置为0；不等于0且小于10秒，会被重置为10秒。
      # 只有空闲连接数大于最大连接数且空闲时间超过该值，才会被释放
      idle-timeout: 30000
      # 连接最大存活时间.不等于0且小于30秒，会被重置为默认值30分钟.设置应该比mysql设置的超时时间短
      max-lifetime: 1800000
      # 等待连接池分配连接的最大时长（毫秒），超过这个时长还没可用的连接则发生SQLException， 缺省:30秒
      connection-timeout: 30000
      # 连接测试查询
      connection-test-query: select 1
      #connection-test-query: select 1 from dual
  cloud:
    nacos:
      discovery:
        group: DEFAULT_GROUP
