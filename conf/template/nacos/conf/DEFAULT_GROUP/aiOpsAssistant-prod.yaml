# spring 相关配置
spring:
  # Kafka配置
  kafka:
    # Kafka服务器地址，多个地址用逗号分隔 (必须修改)
    bootstrap-servers: 192.168.31.172:9092,192.168.31.173:9092,192.168.31.174:9092
    # 生产者配置
    producer:
      # 重试次数
      retries: 3
      # 批处理大小
      batch-size: 16384
      # 缓冲区内存大小
      buffer-memory: 33554432
      # 消息键的序列化方式
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 消息值的序列化方式
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 消息确认机制
      acks: all
    # 消费者配置
    consumer:
      # 消费者分组ID
      group-id: aiops-assistant-group
      # 是否自动提交偏移量
      enable-auto-commit: false
      # 自动提交偏移量的间隔时间
      auto-commit-interval: 1000
      # 当分区没有偏移量时，从哪里开始消费
      auto-offset-reset: earliest
      # 消息键的反序列化方式
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 消息值的反序列化方式
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    # 监听器配置
    listener:
      # 消费者ACK模式：手动或自动确认消息消费
      ack-mode: manual
      # 消费者拉取超时时间
      poll-timeout: 3000
      # 并发数
      concurrency: 3
      # 最大拉取记录数量
      max-poll-records: 500

