zabbixConf {
  source.topic = "zabbix_metric"

  sink{
    topic.alert = "aimeter_alert"
    topic.ck = "aimeter_metric_ck"
    topic.ckText = "aimeter_metric_ck_text"
    topic.vm = "" ### aimeter_metric_vm
  }

  streamConfig {
      application.id = "zabbix_metric-prcessorgroup-001"
      bootstrap.servers = "192.168.31.170:9092,192.168.31.171:9092,192.168.31.172:9092"
      replication.factor = 2
      auto.offset.reset = "latest"
      max.poll.records = 500
      max.request.size = 10485760
      num.stream.threads = 1
      request.timeout.ms = 305000
      session.timeout.ms = 120000
      heartbeat.interval.ms = 30000
      compression.type = "lz4"
      max.poll.interval.ms = 300000
      retries = 1000000
  }
  zabbix.metric.type = "0,3"
}

ZabbixManage{
  Supervisor{
    minBackOff = 30 //in seconds
    maxBackOff = 120 //in seconds
    reset = 60 //in seconds
  }
}

nacos{
  serverAddr = "192.168.31.170:8848"
  namespace = "public"
  servicesName = "zabbixParse"  ##服务名
  groupName = "DEFAULT_GROUP" ## 分组名称
  username = "nacos"
  password = "nacos"
  port = 6050                 ## 为0时，端口号会随机
}

cacheConfig{
  redis{
    password = ""
    timeout = 5000
    nodes = "192.168.31.173:26379,192.168.31.170:26379,192.168.31.171:26379"
    masterName = "mymaster"
    #mode = "single" //sentinel for HA
    mode = "sentinel"
    prefixObject = "am:object-tags:"
    prefixMerge = "am:merge-metric:"
    ttlDay = 14
    probeTTLDay = 7
  }
  timeoutSeconds = 300
  probeTimeoutSeconds = 3600
  mergeTimeoutSeconds = 300
}

subscribe{
    zkConfig{
        zkServer = "192.168.31.172:2181,192.168.31.173:2181,192.168.31.174:2181"
        sessionTimeout = 100000
    }
    itemPath = "/zabbix/sub/itemId"
    tagPath = "/processor/sub/tags"
}