api{
  prefix {
    base = "api"
    version = "v1"
  }
  calendarService {
    event = "/api/v1/calendar/events"
  }
  algLabService {
    model = "/api/v1/model?type=detection"
    binding = "/api/v1/model/bindings?type=detection"
  }
  algTrainService {
    train = "/api/v1/job/submit"
  }
}

timeConfig{
  timeout{
    train = "15" //调用算法服务进行训练的超时时间
    algData = "60" //内部之间调用查找动态变量的超时时间
    calendar = "300" //启动时调用日历服务获取日历的超时时间
    algModel = "300" //启动时调用ailab服务获取模型的超时时间
    algBinding = "300" //启动时调用ailab服务获取模型与指标映射关系的超时时间
    default = "60"
  }
  interval {
    algDataSync = "3600" //每6小时写一次redis
    algDataSyncInit = "300" //首次启动后5分钟开始写算法状态到redis
    changeAndHolidayRefresh = "3600" //每小时生成一次节假日和变更时间
  }
  expire {
    algDataExpireFromRedis = "604800" //7天过期
    algDataExpireFromMemory = "3600" //1小时过期，注意该字段与algDataSync配合使用.
  }
}

redisKey{
  alert = "alert:alert:"
  model = "alert:model:"
}

scale{
  alg = "3" //针对pre_value, upper, lower
  agg = "3" //针对预聚合的结果
  metric = "3" //针对指标表达式计算的结果
}

calendar{
  change{
    rangeStartOffset = "20" //before now，单位天
    rangeEndOffset = "10" // after now，单位天
  }

  holiday{
    rangeStartOffset = "10" //before now，单位天
    rangeEndOffset = "10" // after now，单位天
  }
}

eventManage {
  port=36630 
}

