
metricPerfProcessor{
  source.topic = "aimeter_metric,aimeter_servicecheck"
  streamConfig {
      application.id = "aimeter_metric-processorgroup-001"
      bootstrap.servers = "192.168.31.172:9092,192.168.31.173:9092,192.168.31.174:9092"
      replication.factor = 2
      auto.offset.reset = "latest"
      max.poll.records = 500
      max.request.size = 104857600
      num.stream.threads = 6
      request.timeout.ms = 305000
      session.timeout.ms = 120000
      heartbeat.interval.ms = 30000
      retries = 1000000
      compression.type = "lz4"
      max.poll.interval.ms = 300000
      buffer.memory = 104857600
  }
  instanceBlacklist = "system_fs##mount_point##/run,/mnt,/var/lib,/tmp/;system_disk##mount_point##/run,/mnt,/var/lib,/tmp/;system_net##device_name##lo,veth,docker,virbr,br-"
  seriesIdBlacklist = "pid,pids,ppid,pgid,__help__,__type__,__units__,__alias__,process_number"
  
  sink {
    topic.alert = "aimeter_alert"
    topic.ck = "aimeter_metric_ck"
    topic.vm = "" ### aimeter_metric_vm
  }
}

