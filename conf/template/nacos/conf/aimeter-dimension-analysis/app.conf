clickhouse{
  conn = "jdbc:clickhouse://192.168.31.170:8123,192.168.31.171:8123/aimeter?connectTimeout=300000"
  user = "default"
  password = "znyw@123"
  spanTable = "aimeter.dist_apm_span_index_trace_id"
  pathTable = "aimeter.dist_apm_topology"
  serviceTable = "aimeter.dist_apm_service"
  errorSpanTable = "aimeter.dist_apm_span_error"
  serviceSpanTable = "aimeter.dist_apm_service_span"
  errorTemplateTable = "aimeter.dist_apm_log_template"

  serviceIdFilterByServiceNameSql = "select distinct id from __table__ where service_name in (__services__)"
  serviceIdFilterByPathSql = "select groupUniqArrayArray(servers) as ids from __table__ where hasAny(servers, __service_ids__ ) = 1 "
  serviceNameFilterByServiceIdSql = "select distinct service_name from __table__ where id in (__service_ids__)"
  spanSql = "select trace_id, span_id, span_name, service, service_group_1, service_group_2, service_group_3, service_instance, host_name, k8s_node_name, k8s_cluster_name, k8s_namespace, k8s_pod_name, is_root, parent_span_context, span_kind, start_time, end_time, duration, attributes_key, attributes_value, status, events from __table__ where start_time >= '__startTime__' and start_time < '__endTime__' and service in (__services__) order by trace_id, start_time limit 1000000"
  spanSql2 = "select trace_id, span_id, span_name, service, service_group_1, service_group_2, service_group_3, service_instance, host_name, k8s_node_name, k8s_cluster_name, k8s_namespace, k8s_pod_name, is_root, parent_span_context, span_kind, start_time, end_time, duration, attributes_key, attributes_value, status, events from __table__ where trace_id global in (select trace_id from __table__ where start_time >= '__startTime__' and start_time < '__endTime__' group by trace_id having count(*) > __depth__ limit 100000)"

  errorTemplateIdSql = "select groupUniqArray(template_id) as templateIds from __table__ where start_time >= '__startTime__' and start_time < '__endTime__' and service = '__service__' and span_name = '__span__' "
  errorTemplateSql = "select distinct id, content from __table__ final where id in (__ids__)"

  spanIdByServiceAndSpanSql = "select distinct id from __table__ where service_name = '__service__' and service_span = '__span__'"
  pathIdBySpanIdSql = "select distinct id from __table__ where hasAny(spans, __span_ids__) = 1"
  traceCountByServiceAndSpanSql = "select uniq(trace_id) as traceCount from __table__ where start_time >= '__startTime__' and start_time < '__endTime__' and service = '__service__' and span_name = '__span__'"
}


dimensionAnalysis{
  concurrent = 3
  zscore = 3
  dimension_blacklist = "span_kind, cache.op, cache.cmd, db.statement, cache.type, apm_custom_application, http.status_code, service_group_1, service_group_2, service_group_3"
  changeScale = 3.0
  changeWeight = 0.1
  countWeight = 0
  timeWeight = 0.1
  valueThreshold = 1
  degreeThreshold = 0.1
  scoreThreshold = 0.75
  dimension_whitelist = "apm_peer, url, db.instance"
  durationThreshold = 1000
  depthThreshold = 2
  depthFilterInDb = 0
  walkType = 1
  printTarget = 0.8

  uqBatch = 10
  uqStep = 60

  metrics {
    pod = [
      "sum(kube_kubelet_cpu_usage_total_normalized_pct{__object_type__= 'kubernetes', __metric_type__= 'kube_kubelet', pod_name = '__pod__'})",
      "sum(kube_kubelet_memory_usage_pct{__object_type__= 'kubernetes', __metric_type__= 'kube_kubelet', pod_name = '__pod__'})",
      "sum(kube_kubelet_network_rx_bytes{__object_type__= 'kubernetes', __metric_type__= 'kube_kubelet', pod_name = '__pod__'})",
      "sum(kube_kubelet_network_tx_bytes{__object_type__= 'kubernetes', __metric_type__= 'kube_kubelet', pod_name = '__pod__'})"
    ]

    jvm = [
      "avg(jvm_gc_major_collection_count{__object_type__ = 'apm_service_instance', __metric_type__ = 'apm_instance_jvm', __object_name__ = '__service_instance__'})"
      "avg(jvm_gc_major_collection_time{__object_type__ = 'apm_service_instance', __metric_type__ = 'apm_instance_jvm', __object_name__ = '__service_instance__'})"
      "avg(jvm_cpu_load_process{__object_type__ = 'apm_service_instance', __metric_type__ = 'apm_instance_jvm', __object_name__ = '__service_instance__'})"
    ]

    host = ["avg(system_cpu_total{host = '__host__', __object_type__ = 'system', __metric_type__ = 'system_cpu'})",
      "avg(system_mem_pct_used{host = '__host__', __object_type__ = 'system', __metric_type__ = 'system_mem'})",
      "avg(system_io_util{host = '__host__', __object_type__ = 'system', __metric_type__ = 'system_io'})",
      "avg(system_net_bytes_rcvd{host = '__host__', __object_type__ = 'system', __metric_type__ = 'system_net'})",
      "avg(system_net_bytes_sent{host = '__host__', __object_type__ = 'system', __metric_type__ = 'system_net'})"]
  }

  infraMetricDetectDuration = 1800000 //基础架构指标检测的时间长度，是指从 异常开始的时间点 往前推的时间长度。
}