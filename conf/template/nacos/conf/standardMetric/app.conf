destConf{
  sink {
    topic.alert = "aimeter_alert"
    topic.ck = "aimeter_metric_ck"
    topic.object = "aimeter_dynamic_object"
    topic.vm = "" ### aimeter_metric_vm
  }
  streamConfig {
    group.id = "aimeter_join_standardgroup-001"
    bootstrap.servers = "192.168.31.172:9092,192.168.31.173:9092,192.168.31.174:9092"
    replication.factor = 2
    auto.offset.reset = "latest"
    max.poll.records = 500
    max.request.size = 104857600
    num.stream.threads = 1
    request.timeout.ms = 305000
    session.timeout.ms = 120000
    heartbeat.interval.ms = 30000
    retries = 1000000
    compression.type = "lz4"
    max.poll.interval.ms = 300000
  }
  seriesIdBlacklist = "pid,ppid,pgid,__help__,__type__,__units__,__alias__"
}

sourceConf{
  kafkaServer = "192.168.31.172:9092"    //如果是外部kafka，需要填写kafka server地址，如果为空，用streamConfig的服务地址
  metricTopic = "aimeter_join_metric"        //接入的kafka topic
  objectTopic = "aimeter_join_object"
}

standardManagerJoin {
  Supervisor {
    minBackOff = 30 //in seconds
    maxBackOff = 120 //in seconds
    reset = 60 //in seconds
  }
}

nacos {
  serverAddr = "192.168.31.170:8848"
  namespace = "public"
  servicesName = "aimeter-innerJoin"  ##服务名
  groupName = "DEFAULT_GROUP" ## 分组名称
  username = "nacos"
  password = "znyw@123"
  port = 0                ## 为0时，端口号会随机
}

cacheConfig {
  redis {
    password = "znyw@123"
    timeout = 5000
    nodes = "192.168.31.170:6379"
